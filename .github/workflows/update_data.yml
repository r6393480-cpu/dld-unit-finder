
name: Weekly DLD Data Update

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download CSV and convert to SQLite
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if python convert_csv_to_db.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Download failed. Waiting 60 seconds before retry..."
              sleep 60
            fi
          done
          echo "All 3 attempts failed."
          exit 1

      - name: Compress database
        run: |
          ls -lh dld_units.db
          gzip -9 -k dld_units.db
          echo "DB_SIZE=$(du -h dld_units.db | cut -f1)" >> $GITHUB_ENV
          echo "GZ_SIZE=$(du -h dld_units.db.gz | cut -f1)" >> $GITHUB_ENV
          echo "ROW_COUNT=$(python3 -c "import sqlite3; c=sqlite3.connect('dld_units.db'); print(c.execute('SELECT COUNT(*) FROM units').fetchone()[0])")" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: Delete old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-data --yes --cleanup-tag || true

      - name: Create new release with database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-data \
            dld_units.db.gz \
            db_metadata.json \
            --title "DLD Database - ${{ env.TIMESTAMP }}" \
            --notes "Rows: ${{ env.ROW_COUNT }}; DB size: ${{ env.DB_SIZE }}; Compressed: ${{ env.GZ_SIZE }}; Updated: ${{ env.TIMESTAMP }}" \
            --latest

      - name: Log completion
        run: echo "Database update completed."
