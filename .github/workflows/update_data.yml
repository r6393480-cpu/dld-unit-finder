
name: Weekly DLD Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests gdown

      - name: Download CSV files from Google Drive
        run: |
          gdown --fuzzy "https://drive.google.com/file/d/1q9PXkwolIIlV9sRDsPG7_-nATw9dFkS4/view" -O part1.csv
          gdown --fuzzy "https://drive.google.com/file/d/1Lz_HWONoC3G36JOHZM4bPLYJhDSxxcoL/view" -O part2.csv
          gdown --fuzzy "https://drive.google.com/file/d/1-4Kn0QYc2RCy0QpMTfqwOCg8tpjJh_re/view" -O part3.csv

          test "$(stat -c%s part1.csv)" -gt 300000000
          test "$(stat -c%s part2.csv)" -gt 300000000
          test "$(stat -c%s part3.csv)" -gt 300000000

      - name: Merge CSV files
        run: |
          python - <<'PY'
          import csv

          files = ["part1.csv", "part2.csv", "part3.csv"]
          with open("units_combined.csv", "w", encoding="utf-8", newline="") as out:
              writer = None
              expected_header = None

              for filename in files:
                  with open(filename, "r", encoding="utf-8-sig", newline="") as src:
                      reader = csv.reader(src)
                      header = next(reader)

                      if expected_header is None:
                          expected_header = header
                          writer = csv.writer(out)
                          writer.writerow(header)
                      elif header != expected_header:
                          raise ValueError(f"CSV header mismatch: {filename}")

                      for row in reader:
                          writer.writerow(row)

          print("CSV files merged successfully.")
          PY

      - name: Convert CSV to SQLite
        run: |
          python convert_csv_to_db.py --csv units_combined.csv
          python convert_csv_to_db.py --verify

      - name: Compress database
        run: gzip -9 -k dld_units.db

      - name: Create database release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-data --yes --cleanup-tag || true
          gh release create latest-data \
            dld_units.db.gz db_metadata.json \
            --title "DLD Database Update" \
            --notes "Database built from the three Data Dubai CSV files." \
            --latest
